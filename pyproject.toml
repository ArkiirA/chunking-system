[project]
name = "chunking-system"
version = "0.1.0"
description = "Pure stdlib-only chunking library for RAG ingestion: Document + ChunkingConfig -> Chunks with metadata."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["chunking_system"]
